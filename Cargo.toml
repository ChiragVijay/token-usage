[package]
name = "token-usage"
version = "0.2.7"
edition = "2024"
rust-version = "1.88"
description = "A native, local-first view of AI usage, cost, and limits"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui-component", "dep:tray-icon", "dep:rfd", "dep:open", "dep:raw-window-handle", "dep:windows", "dep:objc2", "dep:objc2-app-kit"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
urlencoding = "2"
tempfile = "3"
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.0", optional = true, default-features = false }
tray-icon = { version = "0.21", optional = true }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_System_SystemInformation"] }
raw-window-handle = { version = "0.6", optional = true }
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "token-usage"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "usage"
path = "src/bin/usage.rs"

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = "thin"
strip = true

